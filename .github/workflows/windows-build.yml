name: Build and Release FinLayer Windows App

permissions:
  contents: write

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix apps/windows-app install
          npm --prefix apps/connector install
          npm --prefix apps/api install

      - name: Generate Prisma Client
        run: |
          cd apps/api && npx prisma generate

      - name: Run Typechecks
        run: |
          npm --prefix apps/windows-app run typecheck
          npm --prefix apps/connector run typecheck
          npm --prefix apps/api run typecheck

      - name: Build Electron App
        run: |
          npm --prefix apps/windows-app run build:ts

      - name: Run electron-builder (Create Windows Installer & latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm --prefix apps/windows-app run build:win

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinLayerSetup-Windows
          path: |
            apps/windows-app/release/FinLayerSetup.exe
            apps/windows-app/release/latest.yml
            apps/windows-app/release/FinLayerSetup.exe.blockmap

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows-app/release/FinLayerSetup.exe
            apps/windows-app/release/latest.yml
            apps/windows-app/release/FinLayerSetup.exe.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
