<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trial Balance — FinLayer Dashboard</title>
  <meta name="description" content="Browse synced Trial Balance reports from TallyPrime." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#080f1e; --surface:#0e1a2e; --surface2:#152035;
      --border:rgba(99,179,237,0.12); --border-2:rgba(99,179,237,0.22);
      --text:#e2e8f0; --muted:#64748b;
      --blue:#3b82f6; --blue-glow:rgba(59,130,246,0.35);
      --purple:#a855f7; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --cyan:#0ea5e9;
      --radius:14px; --radius-sm:8px;
      --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono','Fira Code',monospace;
      --transition:0.2s cubic-bezier(.4,0,.2,1);
    }
    html { font-size:16px; scroll-behavior:smooth; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

    /* nav */
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 32px; border-bottom:1px solid var(--border);
      background:rgba(14,26,46,0.9); backdrop-filter:blur(16px);
      position:sticky; top:0; z-index:50;
    }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700; letter-spacing:-0.02em; text-decoration:none; color:var(--text); }
    .logo-mark { width:32px; height:32px; background:linear-gradient(135deg,var(--blue),var(--purple)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; }
    nav { display:flex; align-items:center; gap:4px; }
    nav a {
      padding:7px 14px; border-radius:var(--radius-sm); font-size:0.83rem; font-weight:500;
      color:var(--muted); text-decoration:none; transition:var(--transition);
    }
    nav a:hover { color:var(--text); background:rgba(255,255,255,0.05); }
    nav a.active { color:var(--blue); background:rgba(59,130,246,0.1); }
    .header-right { display:flex; gap:10px; align-items:center; }
    .btn-sm {
      padding:7px 16px; border-radius:var(--radius-sm); font-family:var(--font); font-size:0.8rem; font-weight:600;
      cursor:pointer; transition:var(--transition); border:1px solid var(--border-2);
      background:var(--surface2); color:var(--text);
    }
    .btn-sm:hover { border-color:var(--blue); background:rgba(59,130,246,0.08); }
    .btn-sm.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn-sm.primary:hover { background:#2563eb; }
    .btn-sm.tb { background:linear-gradient(135deg, #0284c7, #0ea5e9); border-color:transparent; color:#fff; }
    .btn-sm.tb:hover { opacity:0.9; }
    .btn-sm:disabled { opacity:0.45; cursor:not-allowed; }

    main { padding:32px; max-width:1400px; margin:0 auto; }

    /* toolbar */
    .toolbar {
      display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;
    }
    .toolbar h1 { font-size:1.25rem; font-weight:700; flex:1; }
    .company-select {
      padding:8px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); font-family:var(--font); font-size:0.85rem; outline:none;
      cursor:pointer; transition:border-color var(--transition); appearance:none; min-width:220px;
    }
    .company-select:focus { border-color:var(--blue); }
    .search-input {
      padding:8px 14px; background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text); font-family:var(--font); font-size:0.85rem;
      outline:none; transition:border-color var(--transition); min-width:240px;
    }
    .search-input::placeholder { color:var(--muted); }
    .search-input:focus { border-color:var(--blue); }
    .count-badge {
      padding:4px 12px; border-radius:100px; font-size:0.75rem; font-weight:600;
      background:rgba(14,165,233,0.12); color:var(--cyan); border:1px solid rgba(14,165,233,0.25);
    }

    /* summary cards */
    .summary-grid {
      display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:20px;
    }
    .summary-card {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px;
    }
    .summary-card .label { font-size:0.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
    .summary-card .value { font-size:1.45rem; font-weight:700; font-family:var(--mono); }
    .summary-card .value.debit { color:#60a5fa; }
    .summary-card .value.credit { color:#f59e0b; }
    .summary-card .value.balanced { color:#22c55e; }
    .summary-card .value.diff { color:#ef4444; }

    /* sync bar */
    .sync-bar {
      display:flex; justify-content:space-between; align-items:center;
      background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:10px 18px; margin-bottom:20px; font-size:0.85rem; color:var(--muted);
    }
    .sync-bar-left strong { color:var(--text); }

    /* table */
    .table-wrap {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      overflow:hidden;
    }
    table { width:100%; border-collapse:collapse; }
    thead th {
      padding:12px 18px; text-align:left; font-size:0.72rem; font-weight:600;
      text-transform:uppercase; letter-spacing:0.07em; color:var(--muted);
      background:var(--surface2); border-bottom:1px solid var(--border);
      white-space:nowrap;
    }
    thead th.num { text-align:right; }
    tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background var(--transition); }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:rgba(255,255,255,0.03); }
    tbody td { padding:12px 18px; font-size:0.875rem; }
    tbody td.num { text-align:right; font-family:var(--mono); font-size:0.85rem; }
    .td-name { font-weight:500; }
    .td-group { color:var(--muted); font-size:0.82rem; }
    .group-pill {
      display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.75rem;
      background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid rgba(255,255,255,0.08);
    }
    .td-debit { color:#93c5fd; }
    .td-credit { color:#fcd34d; }
    .td-zero { color:rgba(255,255,255,0.2); }
    .empty-row td { padding:48px; text-align:center; color:var(--muted); font-size:0.85rem; }

    /* tfoot */
    tfoot tr {
      background:var(--surface2); border-top:2px solid var(--border-2); font-weight:700;
    }
    tfoot td {
      padding:14px 18px; font-size:0.9rem;
    }
    tfoot td.num {
      text-align:right; font-family:var(--mono); font-size:0.95rem;
    }

    /* toast */
    #toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast {
      padding:10px 18px; border-radius:var(--radius-sm); font-size:0.82rem; font-weight:500;
      color:#fff; box-shadow:0 8px 30px rgba(0,0,0,0.5); animation:toastIn 0.2s ease forwards;
    }
    .toast.info    { background:#1d4ed8; }
    .toast.success { background:#059669; }
    .toast.error   { background:#dc2626; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<header>
  <a href="/dashboard" class="logo">
    <div class="logo-mark">F</div>
    <span>FinLayer</span>
  </a>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/dashboard#financial-overview">Financial Overview</a>
    <a href="/dashboard/trial-balance" class="active">Trial Balance</a>
    <a href="/dashboard/ledgers">Ledgers</a>
    <a href="/dashboard/vouchers">Transactions</a>
    <a href="/dashboard/sync-history">Sync History</a>
    <a href="/setup">Settings</a>
  </nav>
  <div class="header-right">
    <button class="btn-sm" id="refresh-btn" onclick="loadData()">↻ Refresh</button>
    <button class="btn-sm tb" id="sync-btn" onclick="triggerSync()">⚖️ Sync Trial Balance</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <h1>Trial Balance</h1>
    <select class="company-select" id="company-select" onchange="onCompanyChange()">
      <option value="">Loading companies…</option>
    </select>
    <input class="search-input" id="search" placeholder="Search ledger or group…" oninput="renderTable()" />
    <span class="count-badge" id="count-badge">0 entries</span>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="label">Total Debits</div>
      <div class="value debit" id="sum-debit">₹0.00</div>
    </div>
    <div class="summary-card">
      <div class="label">Total Credits</div>
      <div class="value credit" id="sum-credit">₹0.00</div>
    </div>
    <div class="summary-card">
      <div class="label">Status</div>
      <div class="value balanced" id="sum-status">Balanced</div>
    </div>
  </div>

  <div class="sync-bar">
    <div class="sync-bar-left">
      <strong id="sync-company-label">—</strong>
      <span> · Synced entries: </span>
      <strong id="sync-count">0</strong>
    </div>
    <button class="btn-sm primary" id="sync-bar-btn" onclick="triggerSync()">⚡ Sync Now</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Ledger Name</th>
          <th>Group Name</th>
          <th class="num">Debit Amount</th>
          <th class="num">Credit Amount</th>
        </tr>
      </thead>
      <tbody id="tb-body">
        <tr class="empty-row"><td colspan="4">Loading trial balance…</td></tr>
      </tbody>
      <tfoot id="tb-foot" style="display:none;">
        <tr>
          <td colspan="2">Total</td>
          <td class="num td-debit" id="foot-debit">₹0.00</td>
          <td class="num td-credit" id="foot-credit">₹0.00</td>
        </tr>
      </tfoot>
    </table>
  </div>
</main>

<div id="toast-container"></div>

<script>
const API = '';
let companies = [];
let selectedCompanyId = null;
let trialBalanceEntries = [];

function toast(msg, type = 'info', duration = 3500) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

function formatCurrency(amount) {
  return '₹' + Number(amount || 0).toLocaleString('en-IN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

async function loadData() {
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.disabled = true;
  refreshBtn.textContent = 'Refreshing…';

  try {
    const cidParam = selectedCompanyId ? `?companyId=${encodeURIComponent(selectedCompanyId)}` : '';
    const res = await fetch(`${API}/dashboard/data/trial-balance${cidParam}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    companies = data.companies || [];
    selectedCompanyId = data.selectedCompanyId || (companies[0] ? companies[0].id : null);
    trialBalanceEntries = data.trialBalance || [];

    renderCompanySelect();
    renderTable();
  } catch (err) {
    toast(`Failed to load trial balance: ${err.message}`, 'error');
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = '↻ Refresh';
  }
}

function renderCompanySelect() {
  const sel = document.getElementById('company-select');
  sel.innerHTML = '';
  if (companies.length === 0) {
    sel.innerHTML = '<option value="">No companies found</option>';
    return;
  }
  companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.name} (${c.tallyCompanyName})`;
    if (c.id === selectedCompanyId) opt.selected = true;
    sel.appendChild(opt);
  });

  const activeComp = companies.find(c => c.id === selectedCompanyId);
  document.getElementById('sync-company-label').textContent = activeComp ? activeComp.name : '—';
}

function onCompanyChange() {
  const sel = document.getElementById('company-select');
  selectedCompanyId = sel.value;
  loadData();
}

function renderTable() {
  const query = (document.getElementById('search').value || '').toLowerCase().trim();
  const filtered = trialBalanceEntries.filter(e =>
    e.ledgerName.toLowerCase().includes(query) ||
    e.groupName.toLowerCase().includes(query)
  );

  document.getElementById('count-badge').textContent = `${filtered.length} entries`;
  document.getElementById('sync-count').textContent = trialBalanceEntries.length;

  const tbody = document.getElementById('tb-body');
  const tfoot = document.getElementById('tb-foot');

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="4">${trialBalanceEntries.length === 0 ? 'No trial balance entries found. Click "Sync Trial Balance" to sync from Tally.' : 'No entries matching search.'}</td></tr>`;
    tfoot.style.display = 'none';
    updateSummary(0, 0);
    return;
  }

  tbody.innerHTML = filtered.map(item => `
    <tr>
      <td class="td-name">${escapeHtml(item.ledgerName)}</td>
      <td class="td-group"><span class="group-pill">${escapeHtml(item.groupName)}</span></td>
      <td class="num ${item.debitAmount > 0 ? 'td-debit' : 'td-zero'}">${item.debitAmount > 0 ? formatCurrency(item.debitAmount) : '—'}</td>
      <td class="num ${item.creditAmount > 0 ? 'td-credit' : 'td-zero'}">${item.creditAmount > 0 ? formatCurrency(item.creditAmount) : '—'}</td>
    </tr>
  `).join('');

  const totalDebit = filtered.reduce((acc, e) => acc + (e.debitAmount || 0), 0);
  const totalCredit = filtered.reduce((acc, e) => acc + (e.creditAmount || 0), 0);

  document.getElementById('foot-debit').textContent = formatCurrency(totalDebit);
  document.getElementById('foot-credit').textContent = formatCurrency(totalCredit);
  tfoot.style.display = '';

  updateSummary(totalDebit, totalCredit);
}

function updateSummary(totalDebit, totalCredit) {
  document.getElementById('sum-debit').textContent = formatCurrency(totalDebit);
  document.getElementById('sum-credit').textContent = formatCurrency(totalCredit);

  const diff = Math.abs(totalDebit - totalCredit);
  const statusEl = document.getElementById('sum-status');
  if (diff < 0.01) {
    statusEl.className = 'value balanced';
    statusEl.textContent = 'Balanced';
  } else {
    statusEl.className = 'value diff';
    statusEl.textContent = `Diff: ${formatCurrency(diff)}`;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
}

async function triggerSync() {
  if (!selectedCompanyId) {
    toast('Select a company first.', 'error');
    return;
  }

  const syncBtn = document.getElementById('sync-btn');
  const syncBarBtn = document.getElementById('sync-bar-btn');
  syncBtn.disabled = true;
  syncBarBtn.disabled = true;

  try {
    const res = await fetch(`${API}/dashboard/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ companyId: selectedCompanyId, type: 'TRIAL_BALANCE' }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    toast(`✓ TRIAL_BALANCE sync job queued (ID: ${data.jobId.slice(0,8)}…)`, 'success');
    pollJob(data.jobId);
  } catch (err) {
    toast(`Sync failed: ${err.message}`, 'error');
  } finally {
    setTimeout(() => {
      syncBtn.disabled = false;
      syncBarBtn.disabled = false;
    }, 1500);
  }
}

async function pollJob(jobId, attempts = 0) {
  if (attempts > 60) return;
  await new Promise(r => setTimeout(r, 4000));
  try {
    const res = await fetch(`${API}/dashboard/data`);
    if (!res.ok) return;
    const data = await res.json();
    const job = (data.recentJobs || []).find(j => j.id === jobId);
    if (job && job.status === 'COMPLETED') {
      toast('✓ Trial Balance sync completed', 'success');
      loadData();
      return;
    }
    if (!job || job.status === 'PENDING') {
      pollJob(jobId, attempts + 1);
    }
  } catch {}
}

loadData();
</script>
</body>
</html>
