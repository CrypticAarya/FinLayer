<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vouchers — FinLayer Dashboard</title>
  <meta name="description" content="Browse all synced vouchers from TallyPrime." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#080f1e; --surface:#0e1a2e; --surface2:#152035;
      --border:rgba(99,179,237,0.12); --border-2:rgba(99,179,237,0.22);
      --text:#e2e8f0; --muted:#64748b;
      --blue:#3b82f6; --purple:#a855f7; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
      --radius:14px; --radius-sm:8px;
      --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono','Fira Code',monospace;
      --transition:0.2s cubic-bezier(.4,0,.2,1);
    }
    html { font-size:16px; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 32px; border-bottom:1px solid var(--border);
      background:rgba(14,26,46,0.9); backdrop-filter:blur(16px);
      position:sticky; top:0; z-index:50;
    }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700; text-decoration:none; color:var(--text); }
    .logo-mark { width:32px; height:32px; background:linear-gradient(135deg,var(--blue),var(--purple)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; }
    nav { display:flex; align-items:center; gap:4px; }
    nav a { padding:7px 14px; border-radius:var(--radius-sm); font-size:0.83rem; font-weight:500; color:var(--muted); text-decoration:none; transition:var(--transition); }
    nav a:hover { color:var(--text); background:rgba(255,255,255,0.05); }
    nav a.active { color:var(--purple); background:rgba(168,85,247,0.1); }
    .header-right { display:flex; gap:10px; align-items:center; }
    .btn-sm { padding:7px 16px; border-radius:var(--radius-sm); font-family:var(--font); font-size:0.8rem; font-weight:600; cursor:pointer; transition:var(--transition); border:1px solid var(--border-2); background:var(--surface2); color:var(--text); }
    .btn-sm:hover { border-color:var(--purple); background:rgba(168,85,247,0.08); }
    .btn-sm.primary { background:var(--purple); border-color:var(--purple); color:#fff; }
    .btn-sm.primary:hover { background:#9333ea; }
    .btn-sm:disabled { opacity:0.45; cursor:not-allowed; }

    main { padding:32px; max-width:1400px; margin:0 auto; }

    .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .toolbar h1 { font-size:1.25rem; font-weight:700; flex:1; }
    .company-select { padding:8px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:var(--font); font-size:0.85rem; outline:none; cursor:pointer; transition:border-color var(--transition); appearance:none; min-width:200px; }
    .company-select:focus { border-color:var(--purple); }
    .search-input { padding:8px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:var(--font); font-size:0.85rem; outline:none; transition:border-color var(--transition); min-width:220px; }
    .search-input::placeholder { color:var(--muted); }
    .search-input:focus { border-color:var(--purple); }
    .type-select { padding:8px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:var(--font); font-size:0.85rem; outline:none; cursor:pointer; appearance:none; }
    .count-badge { padding:4px 12px; border-radius:100px; font-size:0.75rem; font-weight:600; background:rgba(168,85,247,0.12); color:var(--purple); border:1px solid rgba(168,85,247,0.2); }

    .sync-bar { display:flex; align-items:center; gap:10px; margin-bottom:20px; padding:14px 18px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); }
    .sync-bar-left { flex:1; font-size:0.82rem; color:var(--muted); }
    .sync-bar-left strong { color:var(--text); font-weight:600; }

    /* voucher table */
    .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead th { padding:12px 14px; text-align:left; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap; }
    tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background var(--transition); cursor:pointer; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:rgba(255,255,255,0.03); }
    tbody tr.expanded { background:rgba(168,85,247,0.05); border-bottom:none; }
    tbody td { padding:11px 14px; font-size:0.84rem; }
    .td-mono { font-family:var(--mono); font-size:0.78rem; color:var(--muted); }
    .td-num { font-family:var(--mono); font-size:0.82rem; font-weight:600; text-align:right; }
    .td-num.credit { color:var(--green); }
    .td-num.debit  { color:var(--red); }
    .vtype-badge { display:inline-block; padding:2px 9px; border-radius:100px; font-size:0.7rem; font-weight:600; background:rgba(168,85,247,0.12); color:var(--purple); }

    /* entries expansion */
    .entry-row { display:none; }
    .entry-row.open { display:table-row; }
    .entry-inner { padding:0 14px 14px 32px; }
    .entry-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
    .entry-table th { padding:6px 10px; text-align:left; color:var(--muted); font-size:0.7rem; text-transform:uppercase; border-bottom:1px solid var(--border); }
    .entry-table td { padding:6px 10px; }
    .chevron { font-size:0.7rem; color:var(--muted); transition:transform var(--transition); display:inline-block; }
    .chevron.open { transform:rotate(90deg); }

    .empty-row td { padding:48px; text-align:center; color:var(--muted); font-size:0.85rem; }

    #toast-container { position:fixed; bottom:28px; right:28px; display:flex; flex-direction:column; gap:10px; z-index:999; }
    .toast { padding:12px 20px; border-radius:var(--radius-sm); font-size:0.83rem; font-weight:500; background:var(--surface2); border:1px solid var(--border-2); box-shadow:0 8px 32px rgba(0,0,0,0.4); animation:slideIn .25s ease; max-width:340px; }
    .toast.success { border-color:rgba(34,197,94,0.4); color:var(--green); }
    .toast.error { border-color:rgba(239,68,68,0.4); color:var(--red); }
    .toast.info { border-color:rgba(59,130,246,0.4); color:#93c5fd; }
    @keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
    .spin { display:inline-block; animation:spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
<header>
  <a href="/dashboard" class="logo">
    <div class="logo-mark">F</div>
    <span>FinLayer</span>
  </a>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/dashboard#financial-overview">Financial Overview</a>
    <a href="/dashboard/trial-balance">Trial Balance</a>
    <a href="/dashboard/ledgers">Ledgers</a>
    <a href="/dashboard/vouchers" class="active">Transactions</a>
    <a href="/dashboard/sync-history">Sync History</a>
    <a href="/setup">Settings</a>
  </nav>
  <div class="header-right">
    <button class="btn-sm" onclick="loadData()">↻ Refresh</button>
    <button class="btn-sm primary" id="sync-btn" onclick="triggerSync()">⚡ Sync Now</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <h1>Vouchers</h1>
    <select class="company-select" id="company-select" onchange="onCompanyChange()"><option>Loading…</option></select>
    <select class="type-select" id="type-filter" onchange="renderTable()">
      <option value="">All types</option>
    </select>
    <input class="search-input" id="search" placeholder="Search voucher # or party…" oninput="renderTable()" />
    <span class="count-badge" id="count-badge">0 vouchers</span>
  </div>

  <div class="sync-bar">
    <div class="sync-bar-left">
      <strong id="sync-company-label">—</strong>
      <span> · Last sync: </span>
      <strong id="sync-last">—</strong>
    </div>
    <button class="btn-sm primary" onclick="triggerSync()">⚡ Sync Vouchers</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Voucher #</th>
          <th>Date</th>
          <th>Type</th>
          <th>Party</th>
          <th>Entries</th>
          <th style="text-align:right">Amount</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="7" style="padding:48px;text-align:center;color:var(--muted)">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="toast-container"></div>
<script>
const API = '';
let companies=[], vouchers=[], selectedCompanyId=null;
let expanded = new Set();

function toast(msg,type='info',dur=3500){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toast-container').appendChild(el);setTimeout(()=>el.remove(),dur);}
function timeAgo(iso){if(!iso)return'—';const d=Math.floor((Date.now()-new Date(iso))/1000);if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
function fmt(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fmtAmt(n){return new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadData(){
  const params=selectedCompanyId?`?companyId=${selectedCompanyId}`:'';
  try{
    const res=await fetch(`${API}/dashboard/data/vouchers${params}`);
    const data=await res.json();
    companies=data.companies||[];selectedCompanyId=data.selectedCompanyId||null;vouchers=data.vouchers||[];
    renderCompanySelect();
    populateTypeFilter();
    renderTable();
    if(selectedCompanyId){
      const d2=await fetch(`${API}/dashboard/data`).then(r=>r.json()).catch(()=>null);
      if(d2){const c=(d2.companies||[]).find(c=>c.id===selectedCompanyId);document.getElementById('sync-company-label').textContent=c?.name||'—';document.getElementById('sync-last').textContent=c?.lastSync?timeAgo(c.lastSync.at):'Never';}
    }
  }catch(e){toast('Failed: '+e.message,'error');}
}

function renderCompanySelect(){
  const sel=document.getElementById('company-select');sel.innerHTML='';
  if(!companies.length){sel.innerHTML='<option>No companies</option>';return;}
  companies.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;o.selected=c.id===selectedCompanyId;sel.appendChild(o);});
}
function onCompanyChange(){selectedCompanyId=document.getElementById('company-select').value||null;loadData();}

function populateTypeFilter(){
  const types=[...new Set(vouchers.map(v=>v.voucherType))].sort();
  const sel=document.getElementById('type-filter');
  const cur=sel.value;sel.innerHTML='<option value="">All types</option>';
  types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;o.selected=t===cur;sel.appendChild(o);});
}

function renderTable(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const tf=document.getElementById('type-filter').value;
  let filtered=vouchers;
  if(tf) filtered=filtered.filter(v=>v.voucherType===tf);
  if(q) filtered=filtered.filter(v=>v.voucherNumber.toLowerCase().includes(q)||(v.partyName||'').toLowerCase().includes(q));
  document.getElementById('count-badge').textContent=`${filtered.length} voucher${filtered.length!==1?'s':''}`;
  const tbody=document.getElementById('table-body');
  if(!filtered.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="7">${vouchers.length?'No results.':'No vouchers synced yet. Click "Sync Now".'}</td></tr>`;
    return;
  }
  const rows=[];
  filtered.forEach((v,i)=>{
    rows.push(`
      <tr onclick="toggleEntry('${v.id}')" class="${expanded.has(v.id)?'expanded':''}">
        <td><span class="chevron ${expanded.has(v.id)?'open':''}" id="chev-${v.id}">▶</span></td>
        <td class="td-mono">${esc(v.voucherNumber)}</td>
        <td class="td-mono">${fmt(v.date)}</td>
        <td><span class="vtype-badge">${esc(v.voucherType)}</span></td>
        <td style="color:var(--muted);font-size:0.82rem">${esc(v.partyName)||'<span style="color:var(--muted)">—</span>'}</td>
        <td class="td-mono">${v.entryCount}</td>
        <td class="td-num">${fmtAmt(v.amount)}</td>
      </tr>
      <tr class="entry-row ${expanded.has(v.id)?'open':''}" id="entry-${v.id}">
        <td colspan="7">
          <div class="entry-inner">
            <table class="entry-table">
              <thead><tr><th>Ledger</th><th>Type</th><th style="text-align:right">Amount</th></tr></thead>
              <tbody>
                ${v.entries.map(e=>`<tr>
                  <td>${esc(e.ledgerName)}</td>
                  <td><span style="font-size:0.7rem;font-weight:600;color:${e.type==='debit'?'var(--red)':'var(--green)'}">${e.type.toUpperCase()}</span></td>
                  <td style="text-align:right;font-family:var(--mono);font-size:0.78rem">${fmtAmt(e.amount)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </td>
      </tr>
    `);
  });
  tbody.innerHTML=rows.join('');
}

function toggleEntry(id){
  if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
  renderTable();
}

async function triggerSync(){
  if(!selectedCompanyId){toast('Select a company first','error');return;}
  const btn=document.getElementById('sync-btn');btn.disabled=true;btn.innerHTML='<span class="spin">↻</span> Syncing…';
  try{
    const res=await fetch(`${API}/dashboard/sync`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyId:selectedCompanyId,type:'VOUCHERS'})});
    const d=await res.json();if(!res.ok)throw new Error(d.error||'HTTP '+res.status);
    toast('✓ Voucher sync queued','success');pollForCompletion(d.jobId);
  }catch(e){toast('Sync failed: '+e.message,'error');}
  finally{setTimeout(()=>{btn.disabled=false;btn.innerHTML='⚡ Sync Now';},2000);}
}

async function pollForCompletion(jobId,attempts=0){
  if(attempts>60)return;
  await new Promise(r=>setTimeout(r,5000));
  try{const d=await fetch(`${API}/dashboard/data`).then(r=>r.json());const job=(d.recentJobs||[]).find(j=>j.id===jobId);if(job?.status==='COMPLETED'){toast('✓ Sync completed!','success');loadData();return;}if(!job||job.status==='PENDING')pollForCompletion(jobId,attempts+1);}catch{}
}

loadData();
</script>
</body>
</html>
